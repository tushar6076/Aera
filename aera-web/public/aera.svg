<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glass Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Main Chevron Gradient (Atmospheric Ice -> Deep Cyan/Blue) -->
    <linearGradient id="chevronGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Inner Core Flow / Arrow Gradient -->
    <linearGradient id="innerFlowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.35" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <filter id="softShine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  <!-- Glass Squircle Outer Border -->
  <rect
    x="40"
    y="40"
    width="432"
    height="432"
    rx="120"
    fill="none"
    stroke="url(#glassRim)"
    stroke-width="3"
    opacity="0.85"
  />

  <!-- Subtle Sensor / Grid Orbital Rings -->
  <circle
    cx="256"
    cy="256"
    r="165"
    fill="none"
    stroke="#38bdf8"
    stroke-width="1.5"
    stroke-dasharray="4 8"
    opacity="0.3"
  />

  <!-- Main "A" Chevron Structure -->
  <g filter="url(#subtleGlow)">
    <path
      d="M 148 376 
         L 236 172 
         C 244 154, 268 154, 276 172 
         L 364 376"
      fill="none"
      stroke="url(#chevronGrad)"
      stroke-width="60"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- High-Gloss Apex Highlight Edge -->
  <path
    d="M 215 220 
       C 235 174, 277 174, 297 220"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.65"
  />

  <!-- Upward Airflow Dynamic Core / Arrow -->
  <path
    d="M 256 182 
       L 282 232 
       L 265 232 
       L 265 315 
       L 247 315 
       L 247 232 
       L 230 232 Z"
    fill="url(#innerFlowGrad)"
  />

  <!-- Sensor Node Telemetry Points Along Left & Right Legs -->
  <g fill="#e0f2fe" opacity="0.85">
    <circle cx="205" cy="250" r="3" />
    <circle cx="188" cy="290" r="3" />
    <circle cx="171" cy="330" r="3" />

    <circle cx="307" cy="250" r="3" />
    <circle cx="324" cy="290" r="3" />
    <circle cx="341" cy="330" r="3" />
  </g>

  <!-- Atmospheric Particle Sparkle -->
  <g transform="translate(372, 140)" filter="url(#softShine)">
    <path
      d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z"
      fill="#7dd3fc"
      opacity="0.8"
    />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>
