services:
  aera-cloud:
    build:
      context: ./aera-cloud
      dockerfile: Dockerfile
    container_name: aera-cloud
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./aera-cloud/.env
    networks:
      - aera-network

  aera-web:
    build:
      context: ./aera-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8085}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8085}
    container_name: aera-web
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      - aera-cloud
    networks:
      - aera-network

  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the root .env file}
    depends_on:
      aera-cloud:
        condition: service_healthy
    restart: unless-stopped

networks:
  aera-network:
    driver: bridge
