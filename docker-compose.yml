version: '3.8'

services:
  aera-cloud:
    build:
      context: ./aera-cloud
      dockerfile: Dockerfile
    container_name: aera-cloud
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./aera-cloud/.env
    networks:
      - aera-network

  aera-web:
    build:
      context: ./aera-web
      dockerfile: Dockerfile
    container_name: aera-web
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      - aera-cloud
    networks:
      - aera-network

networks:
  aera-network:
    driver: bridge
