version: '3.8'

services:
  aera-cloud:
    build:
      context: ./aera-cloud
      dockerfile: Dockerfile
    container_name: aera-cloud
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - ./aera-cloud/.env
    # 👇 Keeps container alive and mounts local code for live-reloading
    tty: true 
    volumes:
      - ./aera-cloud:/app
      - /app/venv/          # 💡 Prevents host environment from overwriting container virtual env
    networks:
      - aera-network

  aera-web:
    build:
      context: ./aera-web
      dockerfile: Dockerfile
    container_name: aera-web
    restart: unless-stopped
    ports:
      - "5175:5175"
    depends_on:
      - aera-cloud
    # 👇 Mounts frontend code and protects container's node_modules
    volumes:
      - ./aera-web:/app
      - /app/node_modules/  # 💡 Prevents host node_modules from overwriting container modules
    networks:
      - aera-network

networks:
  aera-network:
    driver: bridge
